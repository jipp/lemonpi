# Shared map blocks (http context).
# Loaded first (00- prefix) so variables are available to all server blocks.

# WebSocket connection upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Filter out OctoPrint's 5s polling from logs.
map $request_uri $loggable {
    ~*/api/states/switch\.basement_3d_printer  0;
    default                                    1;
}
