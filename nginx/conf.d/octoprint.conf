# HTTP - local access
server {
    listen 88;
    listen [::]:88;
    server_name lemonpi;

    access_log /dev/stdout combined if=$loggable;

    location / {
        include /etc/nginx/conf.d/snippets/octoprint_proxy.inc;
    }
}

# HTTPS - external access
server {
    listen 8888 ssl;
    listen [::]:8888 ssl;
    server_name dyndns.wobilix.de;
    auth_basic "Restricted Content";
    auth_basic_user_file /etc/nginx/conf.d/htpasswd;
    ssl_certificate /etc/letsencrypt/live/dyndns.wobilix.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dyndns.wobilix.de/privkey.pem;
    location / {
        access_log off;
        include /etc/nginx/conf.d/snippets/octoprint_proxy.inc;
    }
}
