# HTTP - local access
server {
    listen 80;
    listen [::]:80;
    server_name lemonpi;

    access_log /dev/stdout combined if=$loggable;

    location / {
        include /etc/nginx/conf.d/snippets/homeassistant_proxy.inc;
    }
}

# HTTP - redirect external to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dyndns.wobilix.de;
    return 301 https://$host$request_uri;
}

# HTTPS - external access
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dyndns.wobilix.de;

    ssl_certificate /etc/letsencrypt/live/dyndns.wobilix.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dyndns.wobilix.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling: serve the OCSP response alongside the cert so clients
    # don't have to contact the CA themselves (faster, more private).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/dyndns.wobilix.de/chain.pem;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # HSTS: start at 1 day. Raise to 15768000 (6 months) or more once confirmed
    # that HTTPS works reliably for every client. HSTS is hard to roll back.
    add_header Strict-Transport-Security "max-age=86400" always;

    access_log /dev/stdout combined if=$loggable;

    location / {
        include /etc/nginx/conf.d/snippets/homeassistant_proxy.inc;
    }
}
