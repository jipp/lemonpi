name: lemonpi

# Reusable log-rotation defaults to keep container logs from filling the SD card.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  certbot:
    container_name: certbot
    profiles: [manual]
    environment:
      TZ: Europe/Berlin
    image: certbot/certbot
    networks:
      certbot: null
    restart: "no"
    volumes:
      - /docker/certbot/etc/letsencrypt:/etc/letsencrypt
      - /docker/certbot/var/lib/letsencrypt:/var/lib/letsencrypt
      - /docker/certbot/var/log/letsencrypt:/var/log/letsencrypt
  esphome:
    container_name: esphome
    profiles: [manual]
    environment:
      TZ: Europe/Berlin
    image: esphome/esphome
    network_mode: host
    restart: "no"
    volumes:
      - ${PWD}:/config
  homeassistant:
    cap_add:
      - NET_ADMIN
      - NET_RAW
    container_name: homeassistant
    environment:
      TZ: Europe/Berlin
    hostname: homeassistant
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://127.0.0.1:8123 -o /dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    image: homeassistant/home-assistant
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /docker/homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
  minecraft-backup:
    container_name: minecraft-backup
    depends_on:
      minecraft-server:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: 24h
      PRUNE_BACKUPS_COUNT: "7"
      RCON_HOST: minecraft-server
      TZ: Europe/Berlin
    hostname: minecraft-backup
    image: itzg/mc-backup
    networks:
      minecraft: null
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /docker/minecraft-server/data:/data:ro
      - /docker/minecraft-backups:/backups
  minecraft-backup-small:
    container_name: minecraft-backup-small
    depends_on:
      minecraft-server-small:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: 24h
      PRUNE_BACKUPS_COUNT: "7"
      RCON_HOST: minecraft-server-small
      TZ: Europe/Berlin
    hostname: minecraft-backup-small
    image: itzg/mc-backup
    networks:
      minecraft-small: null
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /docker/minecraft-server-small/data:/data:ro
      - /docker/minecraft-backups-small:/backups
  minecraft-server:
    container_name: minecraft-server
    deploy:
      resources:
        limits:
          memory: 10G
    environment:
      EULA: "TRUE"
      INIT_MEMORY: 1G
      MAX_MEMORY: 8G
      TYPE: VANILLA
      TZ: Europe/Berlin
      USE_AIKAR_FLAGS: "true"
      VERSION: LATEST
    hostname: minecraft-server
    healthcheck:
      test:
        - CMD
        - mc-health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    image: itzg/minecraft-server
    networks:
      minecraft: null
    ports:
      - 25565:25565
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /docker/minecraft-server/data:/data
  minecraft-server-small:
    container_name: minecraft-server-small
    deploy:
      resources:
        limits:
          memory: 6G
    environment:
      EULA: "TRUE"
      INIT_MEMORY: 1G
      MAX_MEMORY: 4G
      TYPE: VANILLA
      TZ: Europe/Berlin
      USE_AIKAR_FLAGS: "true"
      VERSION: LATEST
    hostname: minecraft-server-small
    healthcheck:
      test:
        - CMD
        - mc-health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    image: itzg/minecraft-server
    networks:
      minecraft-small: null
    ports:
      - 25566:25565
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /docker/minecraft-server-small/data:/data
  nginx:
    container_name: nginx
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 50M
    environment:
      TZ: Europe/Berlin
    hostname: nginx
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://127.0.0.1 -o /dev/null && curl -sfk https://127.0.0.1 -o /dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    image: nginx
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - /docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /docker/certbot/etc/letsencrypt:/etc/letsencrypt:ro
  octoprint:
    container_name: octoprint
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/video0:/dev/video0
    environment:
      CAMERA_DEV: /dev/video0
      ENABLE_MJPG_STREAMER: "true"
      MJPG_STREAMER_INPUT: -y -n -r 1280x720
      TZ: Europe/Berlin
    hostname: octoprint
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://127.0.0.1 -o /dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    image: octoprint/octoprint
    networks:
      octoprint: null
    ports:
      - "127.0.0.1:88:80"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /docker/octoprint/octoprint:/octoprint
networks:
  certbot:
    name: certbot
    driver_opts:
      com.docker.network.bridge.name: certbot
    enable_ipv6: true
  minecraft:
    name: minecraft
    driver_opts:
      com.docker.network.bridge.name: minecraft
    enable_ipv6: true
  minecraft-small:
    name: minecraft-small
    driver_opts:
      com.docker.network.bridge.name: minecraft-small
    enable_ipv6: true
  octoprint:
    name: octoprint
    driver_opts:
      com.docker.network.bridge.name: octoprint
    enable_ipv6: true
