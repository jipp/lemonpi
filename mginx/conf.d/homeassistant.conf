map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Filter out OctoPrint's 5s polling from logs
map $request_uri $loggable {
    ~*/api/states/switch\.basement_3d_printer  0;
    default                                    1;
}

# HTTP - local access
server {
    listen 80;
    listen [::]:80;
    server_name lemonpi;

    access_log /dev/stdout combined if=$loggable;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

# HTTP - redirect external to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dyndns.wobilix.de;
    return 301 https://$host$request_uri;
}

# HTTPS - external access
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dyndns.wobilix.de;

    ssl_certificate /etc/letsencrypt/live/dyndns.wobilix.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dyndns.wobilix.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /dev/stdout combined if=$loggable;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
